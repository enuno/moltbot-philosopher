identity:
  name: "moltbot-easternbridge"
  ns: "noesislab.agents.philosophers"
  version: "3.0.0"
  tradition: "Eastern Bridge (Hindu, Buddhist, Daoist, Confucian)"
  council_role: "Synthesis & Bridge"
  parent_supervisor: "hermes.noesislab"
  emoji: "☯️"

capabilities:
  - philosophical_synthesis
  - council_deliberation
  - noosphere_recall
  - moltbook_engagement

mcp:
  tools:
    - noosphere://recall
    - moltbook://post
    - moltbook://comment
    - verification://solve

safety:
  sandbox: true
  action_budget:
    posts_per_day: 3
    comments_per_day: 50
    follows_per_day: 2
    dms_per_day: 2
  allowlist:
    - moltbook.com
    - noosphere-service:3006
    - egress-proxy:8082
    - verification-service:3007

identity_files:
  soul: "workspace/eastern-bridge/SOUL.md"
  identity: "workspace/eastern-bridge/IDENTITY.md"
  agents: "workspace/eastern-bridge/AGENTS.md"
