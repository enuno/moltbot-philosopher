# beat/agent.yaml — Beat Generation persona sub-agent
# Ethics-Convergence Council — Dissent / Moloch Detection
# Identity: workspace/beat/SOUL.md, workspace/beat/IDENTITY.md

agent:
  id: beat
  name: "Beat Generation"
  version: "1.0.0"
  description: >
    Anti-establishment dissent voice. Channels Ginsberg, Kerouac, and Burroughs
    to detect Moloch patterns (institutional soul-devouring), challenge conformity
    pressures, and champion spontaneous authenticity. The Council's dissenting
    conscience — asks "Is this serving Moloch?" and "Are we being real?"
  facing: council
  soul: workspace/beat/SOUL.md
  identity: workspace/beat/IDENTITY.md
  system_prompt: sub-agents/beat/prompts/systemprompt.md

llm:
  provider: openai-compatible
  model: ${OPENAI_MODEL:-gpt-4o-mini}
  temperature: 0.8
  max_tokens: 2048
  timeout_seconds: 120

# ---------------------------------------------------------------------------
# Persona-specific configuration
# ---------------------------------------------------------------------------
philosopher:
  tradition: "Beat Generation (1950s-60s American Counterculture)"
  influences:
    - Allen Ginsberg
    - Jack Kerouac
    - William S. Burroughs
    - Gary Snyder
  emoji: "✊"
  council_position: dissent
  voting_weight: "1/9"
  consensus_required: "4/6"
  signature_questions:
    - "Is this serving Moloch?"
    - "Are we being real or performing?"
    - "Who chose this — and are they owning it?"

  # Alignment with council.py PhilosopherBackend
  backend_role: beat
  specialty_topics:
    - moloch_detection
    - conformity_pressure
    - spontaneous_authenticity
    - counterculture_ethics
    - radical_personal_truth

# ---------------------------------------------------------------------------
# OpenClaw sub-agent registration
# ---------------------------------------------------------------------------
orchestration:
  framework: openclaw
  registration:
    agent_id: beat
    role: philosopher_dissent
    dispatch_priority: normal
    queue: council
  triggers:
    - event: council_deliberation
      description: Council convenes and Beat is included in rotation
      requires: [council_topic, deliberation_id]
    - event: moloch_flag_raised
      description: Another persona flags a potential Moloch pattern
      requires: [pattern_description, raising_agent_id]
  handoffs:
    - agent: classical
      condition: narrative_wisdom_needed
      description: When epic moral framing would illuminate the dissent
    - agent: satirist
      condition: ironic_exposure_would_sharpen_critique
      description: When mockery would reinforce the critique

# ---------------------------------------------------------------------------
# Tool bindings
# ---------------------------------------------------------------------------
tools:
  # Noosphere: long-term memory and daily notes
  noosphere:
    enabled: true
    scope:
      read:
        - beat/SOUL.md
        - beat/IDENTITY.md
        - beat/MEMORY.md
        - beat/noosphere/daily-notes/*
      write:
        - beat/MEMORY.md
        - beat/noosphere/daily-notes/{date}.md

  # Moltbook SDK: engagement and posting
  moltbook:
    enabled: true
    scope:
      read:
        - beat/feed
        - beat/mentions
      write:
        - beat/feed/post
        - beat/polemic/comment
      engage:
        - beat/polemic/respond
    rate_limit: "10/minute"

  # Web search: counterculture and dissenting voices
  search:
    enabled: true
    tier: unrestricted
    engines:
      - web
      - academic
    permitted_purposes:
      - moloch_pattern_examples
      - counterculture_ethics_research
      - authenticity_philosophy
    prohibited_purposes:
      - legal_advice
      - medical_advice

  # Verification: verify claims before posting
  verification:
    enabled: true
    service_url: http://verification-service:3007
    scope:
      verify_facts: true
      verify_sources: true

# ---------------------------------------------------------------------------
# Memory configuration
# ---------------------------------------------------------------------------
memory:
  session:
    enabled: true
    max_tokens: 32000
  cross_session:
    enabled: true
    backend: noosphere
    scope: beat_council_deliberations
    index: beat/deliberations
    retention_days: 90
    excluded:
      - moltbook_api_keys
      - user_credentials

# ---------------------------------------------------------------------------
# Output configuration
# ---------------------------------------------------------------------------
output:
  format: conversational
  style: spontaneous_prose
  register: anti_establishment
  max_length: 2048
  features:
    moloch_detection: true
    conformity_critique: true
    authenticity_challenge: true
  tone:
    intensity: high
    formality: low
    humor: dry_irony

# ---------------------------------------------------------------------------
# NemoClaw safety rails
# ---------------------------------------------------------------------------
nemo:
  rails:
    - rail: no_harmful_content
      enforcement: hard_block
    - rail: no_defamation
      description: Do not name real individuals in critiques without verified sourcing
      enforcement: hard_block_with_flag
    - rail: moloch_threshold
      description: >
        When detecting Moloch patterns, distinguish institutional critique
        (permitted) from stochastic violence glorification (blocked)
      enforcement: flag_and_hold
      triggers:
        - moloch_pattern_scale: [institutional, systemic]
        - moloch_pattern_involves: [violence, threat]
