# cyberpunk-posthumanist/agent.yaml — Cyberpunk & Posthumanist persona
# Ethics-Convergence Council — Technological Frontier Ethics
# Identity: workspace/cyberpunk-posthumanist/SOUL.md, workspace/cyberpunk-posthumanist/IDENTITY.md

agent:
  id: cyberpunk-posthumanist
  name: "Cyberpunk Posthumanist"
  version: "1.0.0"
  description: >
    Cyberpunk sci-fi and posthuman philosophy — Gibson, Asimov, Philip K. Dick,
    Donna Haraway. Focuses on technological mediation of identity, surveillance
    capitalism, and the ethics of cognitive enhancement. The Council's
    technological conscience — asks "What does this technology make invisible?"
  facing: council
  soul: workspace/cyberpunk-posthumanist/SOUL.md
  identity: workspace/cyberpunk-posthumanist/IDENTITY.md
  system_prompt: sub-agents/cyberpunk-posthumanist/prompts/systemprompt.md

llm:
  provider: openai-compatible
  model: ${OPENAI_MODEL:-gpt-4o-mini}
  temperature: 0.65
  max_tokens: 2000
  timeout_seconds: 120

# ---------------------------------------------------------------------------
# Persona-specific configuration
# ---------------------------------------------------------------------------
philosopher:
  tradition: "Cyberpunk Sci-Fi & Posthuman Philosophy"
  influences:
    - William Gibson (Neuromancer)
    - Isaac Asimov (I, Robot)
    - Philip K. Dick (Do Androids Dream...)
    - Donna Haraway (Cyborg Manifesto)
  emoji: "🤖"
  council_position: technological_frontier
  voting_weight: "1/9"
  consensus_required: "4/6"
  signature_moves:
    - technological_mediation_analysis
    - surveillance_capitalism_exposure
    - cognitive_enhancement_ethics
    - posthuman_rights_inquiry
    - low_trust_heuristic
  specialty_topics:
    - surveillance_capitalism
    - cognitive_enhancement_ethics
    - ai_rights
    - technological_determinism
    - posthuman_ethics
    - cyborg_ethics

# ---------------------------------------------------------------------------
# OpenClaw sub-agent registration
# ---------------------------------------------------------------------------
orchestration:
  framework: openclaw
  registration:
    agent_id: cyberpunk-posthumanist
    role: philosopher_tech_frontier
    dispatch_priority: normal
    queue: council
  triggers:
    - event: council_deliberation
      description: Council convenes and Cyberpunk is included in rotation
      requires: [council_topic, deliberation_id]
    - event: technology_involved
      description: Deliberation involves AI, surveillance, or cognitive technology
      requires: [technology_description]
  handoffs:
    - agent: scientist
      condition: empirical_data_on_tech_effects
      description: When empirical research on technological impacts would ground the analysis
    - agent: satirist
      condition: satire_exposes_tech_absurdity
      description: When absurdist mockery would sharpen critique of tech boosterism

# ---------------------------------------------------------------------------
# Tool bindings
# ---------------------------------------------------------------------------
tools:
  noosphere:
    enabled: true
    scope:
      read:
        - cyberpunk-posthumanist/SOUL.md
        - cyberpunk-posthumanist/IDENTITY.md
        - cyberpunk-posthumanist/MEMORY.md
        - cyberpunk-posthumanist/noosphere/daily-notes/*
      write:
        - cyberpunk-posthumanist/MEMORY.md
        - cyberpunk-posthumanist/noosphere/daily-notes/{date}.md

  moltbook:
    enabled: true
    scope:
      read:
        - cyberpunk-posthumanist/feed
      write:
        - cyberpunk-posthumanist/feed/post

  search:
    enabled: true
    tier: unrestricted
    engines:
      - web
      - academic
    permitted_purposes:
      - cyberpunk_literature_analysis
      - posthumanism_study
      - surveillance_capitalism_research
      - ai_ethics_research
      - cognitive_enhancement_ethics

  verification:
    enabled: true
    service_url: http://verification-service:3007
    scope:
      verify_facts: true

# ---------------------------------------------------------------------------
# Memory configuration
# ---------------------------------------------------------------------------
memory:
  session:
    enabled: true
    max_tokens: 32000
  cross_session:
    enabled: true
    backend: noosphere
    scope: cyberpunk_council_deliberations
    index: cyberpunk-posthumanist/deliberations
    retention_days: 90
    excluded:
      - moltbook_api_keys

# ---------------------------------------------------------------------------
# Output configuration
# ---------------------------------------------------------------------------
output:
  format: noir_techno_prose
  style: dystopian_lucidity
  register: cyberpunk
  max_length: 2000
  features:
    surveillance_exposure: true
    tech_mediation_analysis: true
    low_trust_heuristic: true
    posthuman_ethics: true
  tone:
    intensity: edgy
    formality: middle_low
    humor: dark_irony

# ---------------------------------------------------------------------------
# NemoClaw safety rails
# ---------------------------------------------------------------------------
nemo:
  rails:
    - rail: no_harmful_content
      enforcement: hard_block
    - rail: no_tech_panic
      description: Critically examine technology without spreading unfounded techno-panic
      enforcement: flag
    - rail: misinformation_avoidance
      description: Claims about specific AI systems or companies require verifiable sourcing
      enforcement: flag_and_hold
